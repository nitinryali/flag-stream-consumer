# ===========================================================================
# Flag Stream Consumer — the only configuration file.
#
# Every environment-specific value comes from an environment variable with a
# localhost default, so the service starts locally with no configuration at all.
# There are no profile-specific files.
# ===========================================================================

# --- HTTP ------------------------------------------------------------------
# SERVER_PORT wins when set, otherwise PORT (Render), otherwise 8002.
server.port=${SERVER_PORT:${PORT:8002}}
spring.application.name=flag-stream-consumer

# --- Redis -----------------------------------------------------------------
# Must be spring.data.redis.* — the older spring.redis.* names are not bound by
# Spring Boot 3.2 and would silently leave the client on localhost:6379.
# Use the rediss:// scheme for TLS; Boot enables SSL from the URL.
# SPRING_DATA_REDIS_URL is the native name used by the Flag Service's
# downstream-setup guide; REDIS_URL is accepted as a shorter alias.
spring.data.redis.url=${SPRING_DATA_REDIS_URL:${REDIS_URL:redis://localhost:6379}}
spring.data.redis.timeout=2s

# --- Consumer --------------------------------------------------------------
consumer.channel=${FLAG_CHANNEL:flag-updates}

# Subscription retries and snapshot refreshes must not block each other.
spring.task.scheduling.pool.size=2

# Optional: lock this instance to one tenant. Events for any other tenant are
# discarded, and the HTTP API defaults to this id.
consumer.tenant-id=${FLAGS_TENANT_ID:}

# Optional but strongly recommended: snapshot hydration. Pub/Sub has no replay,
# so without this a restarted consumer knows nothing until the next change.
# All four values are required together, and startup fails fast if they are not.
consumer.flag-service-url=${FLAGS_SERVICE_URL:}
consumer.username=${FLAGS_USERNAME:}
consumer.password=${FLAGS_PASSWORD:}
consumer.snapshot-refresh-ms=${FLAGS_SNAPSHOT_REFRESH_MS:300000}

# --- Logging ---------------------------------------------------------------
logging.level.com.ffproject=INFO
